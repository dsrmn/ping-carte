name: Build card index

# 1) Aggiorna la lista carte con le più giocate in Edison su Format Library
# 2) Ricostruisce cards_index.json da zero (versioni delle carte su Cardtrader)
# - Si lancia a mano dalla scheda "Actions" (pulsante "Run workflow")
# - Gira da solo ogni lunedì notte
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna la lista carte da Format Library
        # Se Format Library non risponde si tiene la lista attuale
        continue-on-error: true
        run: python update_card_list.py

      - name: Costruisci indice carte
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python build_card_index.py

      - name: Salva lista carte e indice nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in cards_index.json config.json format_library_stats.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna lista carte e indice"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push fallito (tentativo $i), riprovo tra 5 secondi..."
              sleep 5
            done
          fi
