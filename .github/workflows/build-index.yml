name: Build card index

# Ricostruisce cards_index.json da zero.
# - Si lancia a mano dalla scheda "Actions" (pulsante "Run workflow")
# - Gira da solo ogni lunedì notte, per includere i set appena usciti
#   (es. nuove espansioni Pokémon / One Piece)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Costruisci indice carte
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python build_card_index.py

      - name: Salva cards_index.json nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cards_index.json
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna indice carte"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push fallito (tentativo $i), riprovo tra 5 secondi..."
              sleep 5
            done
          fi
