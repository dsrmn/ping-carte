name: Monitor Cardtrader prices

on:
  schedule:
    - cron: "*/59 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova senza mandare messaggi Telegram (li stampa nel log)"
        type: boolean
        default: false

permissions:
  contents: write

# Mai due scansioni (o una scansione e una ricostruzione dell'indice) insieme
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna l'indice carte se la lista è cambiata
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python build_card_index.py --if-outdated

      - name: Esegui scansione prezzi
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi

      - name: Salva lo storico delle notifiche e l'indice
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sent_alerts.json cards_index.json
          if ! git diff --staged --quiet; then
            git commit -m "Aggiorna alert inviati"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push fallito (tentativo $i), riprovo tra 5 secondi..."
              sleep 5
            done
          fi
